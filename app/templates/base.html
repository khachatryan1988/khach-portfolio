<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>{{ p.name }} — Portfolio</title>
    <meta name="description" content="{{ p.headline }}">

    <!-- OpenGraph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ p.name }} — {{ p.badge }}">
    <meta property="og:description" content="{{ p.headline }}">
    <meta property="og:url" content="{{ p.site_url }}{{ page_path }}">
    <meta property="og:image" content="{{ p.site_url }}{{ p.og_image }}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ p.name }} — {{ p.badge }}">
    <meta name="twitter:description" content="{{ p.headline }}">
    <meta name="twitter:image" content="{{ p.site_url }}{{ p.og_image }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body class="bg-zinc-950 text-zinc-100">
<div class="bg-grid"></div>
<div class="matrix-bg"></div>
<div class="max-w-6xl mx-auto px-5">
    <header class="py-7 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3">
            <span class="h-9 w-9 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center font-semibold">K</span>
            <div class="leading-tight">
                <div class="font-semibold tracking-tight">{{ p.name }}</div>
                <div class="text-xs text-zinc-400">{{ p.badge }}</div>
            </div>
        </a>

        <nav class="hidden md:flex gap-5 text-sm text-zinc-300">
            <a class="navlink" href="/#experience">Experience</a>
            <a class="navlink" href="/#skills">Skills</a>
            <a class="navlink" href="/projects">Projects</a>
            <a class="navlink" href="/#education">Education</a>
            <a class="navlink" href="/#contact">Contact</a>
        </nav>

        <div class="flex gap-2">
            <a class="btn ghost" href="{{ p.links.linkedin }}" target="_blank" rel="noreferrer">LinkedIn</a>
        </div>
    </header>

    <main class="pb-14">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-10 text-sm text-zinc-500">
        © {{ p.name }} • Python · FastAPI
    </footer>
</div>

<canvas id="matrix"></canvas>
<script>
    (function () {
        const canvas = document.getElementById("matrix");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const letters = "01";
        const fontSize = 18; // крупнее = реже столбцы
        let columns = Math.floor(canvas.width / fontSize);
        let drops = new Array(columns).fill(1);

        function reset() {
            columns = Math.floor(canvas.width / fontSize);
            drops = new Array(columns).fill(1);
        }
        window.addEventListener("resize", reset);

        function draw() {
            // сильный “шлейф” → эффект почти растворён
            ctx.fillStyle = "rgba(0,0,0,0.18)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";
            ctx.fillStyle = "rgba(0,255,120,0.25)"; // 👈 очень низкая яркость

            for (let i = 0; i < drops.length; i++) {
                // рисуем только иногда → редкая плотность
                if (Math.random() < 0.18) continue;

                const ch = letters[(Math.random() * letters.length) | 0];
                ctx.fillText(ch, i * fontSize, drops[i] * fontSize);

                // медленнее падение
                if (Math.random() < 0.35) drops[i]++;

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.985) {
                    drops[i] = 0;
                }
            }

            // меньше FPS
            setTimeout(() => requestAnimationFrame(draw), 45);
        }

        draw();
    })();

</script>
</body>
</html>
